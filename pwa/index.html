<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f7ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101410" media="(prefers-color-scheme: dark)">
  <title>ClockManage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f3f7ef; --surface: #fff; --surface-2: #eaf1e5; --text: #161d15; --muted: #5d665a; --line: #e1e8dc;
      --primary: #2e7d32; --on-primary: #fff; --tint: #dcefd8; --on-tint: #0c3a10; --price: #1f6a24; --error: #b3261e;
      --shadow: 0 1px 2px rgba(20, 40, 20, .06), 0 4px 14px rgba(20, 40, 20, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f130f; --surface: #1a2019; --surface-2: #222a21; --text: #e2e7dd; --muted: #a2ac9e; --line: #2c342b;
        --primary: #8fd98b; --on-primary: #00390a; --tint: #24402a; --on-tint: #c8f0c3; --price: #9be196; --error: #ffb4ab;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px); }
    svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
    .top { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
    .top img { width: 44px; height: 44px; border-radius: 12px; box-shadow: var(--shadow); }
    .top h1 { font-size: 24px; line-height: 28px; margin: 0; letter-spacing: -.01em; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: #43a047; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 4px 10px; font-weight: 600; }
    h3 { display: flex; align-items: center; gap: 8px; font-size: 17px; margin: 20px 4px 10px; }
    h3 svg { color: var(--primary); }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .card { background: var(--surface); border-radius: 18px; padding: 14px 16px; margin: 10px 0; box-shadow: var(--shadow); }
    .meals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .meal { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border: 0; border-radius: 16px;
      background: var(--surface); color: var(--text); font: 600 15px/18px inherit; font-family: inherit; box-shadow: var(--shadow); }
    .meal svg { width: 26px; height: 26px; color: var(--primary); }
    .meal.on { background: var(--primary); color: var(--on-primary); }
    .meal.on svg { color: var(--on-primary); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .note { margin: 10px 4px 0; }
    .picks-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 26px 4px 4px; }
    .picks-head h2 { margin: 0; }
    .venue { background: var(--surface); border-radius: 18px; margin: 10px 0; box-shadow: var(--shadow); overflow: hidden; }
    .banner { height: 112px; background: var(--surface-2) center / cover no-repeat; }
    .vhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; }
    .vhead .grow { flex: 1; min-width: 0; }
    .vname { font-weight: 700; font-size: 17px; line-height: 22px; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
    .pill svg { width: 14px; height: 14px; }
    .open { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; background: var(--tint); color: var(--on-tint);
      text-decoration: none; font-weight: 600; font-size: 15px; white-space: nowrap; }
    .open svg { width: 16px; height: 16px; }
    a.item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
    a.item:active { background: var(--surface-2); }
    .item .grow { flex: 1; min-width: 0; }
    .thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); }
    .iname { font-weight: 600; }
    .why { display: flex; gap: 5px; align-items: flex-start; color: var(--muted); font-size: 14px; margin-top: 2px; }
    .why svg { width: 14px; height: 14px; margin-top: 3px; color: var(--primary); }
    .price { color: var(--price); font-weight: 700; white-space: nowrap; }
    .chev { color: var(--muted); width: 20px; height: 20px; }
    .total { display: flex; justify-content: space-between; padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .total b { color: var(--text); }
    details.card summary { list-style: none; display: flex; align-items: center; justify-content: space-between; font-weight: 600; cursor: pointer; }
    details.card summary::-webkit-details-marker { display: none; }
    details.card summary .muted { font-weight: 400; }
    details[open] summary { margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip { border: 1px solid var(--line); background: none; color: var(--text); border-radius: 999px; padding: 7px 14px; font: 500 14px/18px inherit; font-family: inherit; }
    .chip.on { background: var(--tint); color: var(--on-tint); border-color: transparent; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 11px 20px;
      font: 600 15px/20px inherit; font-family: inherit; background: var(--primary); color: var(--on-primary); text-decoration: none; }
    .btn.text { background: none; color: var(--primary); padding: 10px 4px; }
    input, textarea { width: 100%; font: inherit; color: inherit; background: var(--surface-2); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px; }
    textarea:focus, input:focus { outline: none; border-color: var(--primary); }
    input.code { font-size: 22px; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .error { color: var(--error); }
    #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); background: var(--text); color: var(--bg);
      border-radius: 14px; padding: 12px 16px; display: none; box-shadow: var(--shadow); }
  </style>
</head>
<body>
  <header class="top"><img src="apple-touch-icon.png" alt=""><div><h1>ClockManage</h1><span class="status" id="status" hidden><i></i><span></span></span></div></header>
  <main id="app"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
