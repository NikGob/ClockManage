<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2E7D32">
  <title>ClockManage</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg: #f6faf3; --surface: #fff; --text: #181d17; --muted: #5c6459; --primary: #2e7d32; --on-primary: #fff; --line: #dde5d9; --error: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101410; --surface: #1c211b; --text: #e0e4dc; --muted: #a3ad9f; --primary: #8fd98b; --on-primary: #00390a; --line: #2f362d; --error: #ffb4ab; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
    h1 { font-size: 28px; margin: 20px 0 4px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
    .venue-head { display: flex; align-items: center; gap: 12px; }
    .venue-head .grow { flex: 1; min-width: 0; }
    .name { font-weight: 600; }
    a.dish { display: flex; gap: 12px; justify-content: space-between; text-decoration: none; color: inherit; padding: 10px 0; border-top: 1px solid var(--line); }
    a.dish .price { color: var(--primary); font-weight: 600; white-space: nowrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; padding: 10px 18px; font: 600 15px/20px inherit; font-family: inherit; background: var(--primary); color: var(--on-primary); text-decoration: none; }
    .btn.tonal { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--text); }
    .btn.text { background: none; color: var(--primary); padding: 10px 4px; }
    input, textarea { width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    input.code { font-size: 22px; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .error { color: var(--error); }
    #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 16px; display: none; }
  </style>
</head>
<body>
  <h1>ClockManage</h1>
  <main id="app"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
