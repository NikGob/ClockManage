name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p clockmanage-core -p cm-guard

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner ships the Android SDK; Gradle comes from the action (no wrapper jar in the repo).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      # versionCode = run number (see app/build.gradle.kts): every build installs over the last.
      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/.*val base = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          name="$v ($GITHUB_RUN_NUMBER)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "ClockManage-android-$v.apk"
          mkdir -p bundle
          cp android/app/build/outputs/apk/release/app-release.apk bundle/ClockManage-android.apk
          printf '{"code":%s,"name":"%s"}\n' "$GITHUB_RUN_NUMBER" "$name" > bundle/apk.json
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-android-${{ steps.ver.outputs.version }}
          path: ClockManage-android-*.apk
          if-no-files-found: error
      # The same APK rides inside the Windows installer: the PC serves it to the phone.
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: bundle/
          if-no-files-found: error
      # The release itself is published by the windows job, all files at once: installed apps
      # read releases/latest, and a release without latest.json yet would fail their check.

  windows:
    runs-on: windows-latest
    needs: android
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle
          path: src-tauri/resources/android
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The launch guard ships next to the app as a Tauri sidecar (bundle.externalBin).
      - name: Build launch guard
        shell: pwsh
        run: |
          cargo build --release -p cm-guard
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/cm-guard.exe src-tauri/binaries/cm-guard-x86_64-pc-windows-msvc.exe
      - name: Tests
        run: cargo test --workspace
      # Signs the installer for the in-app updater. Without the secrets (forks, PRs) the
      # installer is built unsigned and a release gets no latest.json.
      - name: Build installer
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content updater.json
            npx --yes @tauri-apps/cli@2 build --config "$PWD/updater.json"
          } else {
            npx --yes @tauri-apps/cli@2 build
          }
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      # Only the installer: one thing to download, installs/updates a single app in place.
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-${{ steps.ver.outputs.version }}-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Android APK for the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item src-tauri/resources/android/ClockManage-android.apk "ClockManage-android-${{ steps.ver.outputs.version }}.apk"
      # What the app reads to update itself: releases/latest/download/latest.json.
      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $exe = Get-Item target/release/bundle/nsis/*-setup.exe
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
          @{
            version   = '${{ steps.ver.outputs.version }}'
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = $url } }
          } | ConvertTo-Json -Depth 4 | Set-Content target/release/bundle/nsis/latest.json -Encoding utf8NoBOM
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/latest.json
            ClockManage-android-*.apk
