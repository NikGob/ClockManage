name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p clockmanage-core -p cm-guard

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner ships the Android SDK; Gradle comes from the action (no wrapper jar in the repo).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "ClockManage-android-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-android-${{ steps.ver.outputs.version }}
          path: ClockManage-android-*.apk
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClockManage-android-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The launch guard ships next to the app as a Tauri sidecar (bundle.externalBin).
      - name: Build launch guard
        shell: pwsh
        run: |
          cargo build --release -p cm-guard
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/cm-guard.exe src-tauri/binaries/cm-guard-x86_64-pc-windows-msvc.exe
      - name: Tests
        run: cargo test --workspace
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      # Only the installer: one thing to download, installs/updates a single app in place.
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-${{ steps.ver.outputs.version }}-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
