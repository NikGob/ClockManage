name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p clockmanage-core -p cm-guard

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner ships the Android SDK; Gradle comes from the action (no wrapper jar in the repo).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      # versionCode = run number (see app/build.gradle.kts): every build installs over the last.
      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/.*val base = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          name="$v ($GITHUB_RUN_NUMBER)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "ClockManage-android-$v.apk"
          mkdir -p bundle
          cp android/app/build/outputs/apk/release/app-release.apk bundle/ClockManage-android.apk
          printf '{"code":%s,"name":"%s"}\n' "$GITHUB_RUN_NUMBER" "$name" > bundle/apk.json
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-android-${{ steps.ver.outputs.version }}
          path: ClockManage-android-*.apk
          if-no-files-found: error
      # The same APK rides inside the Windows installer: the PC serves it to the phone.
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: bundle/
          if-no-files-found: error
      # The release itself is published by the release job, all files at once: installed apps
      # read releases/latest, and a release without latest.json yet would fail their check.

  windows:
    runs-on: windows-latest
    needs: android
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle
          path: src-tauri/resources/android
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The launch guard ships next to the app as a Tauri sidecar (bundle.externalBin).
      - name: Build launch guard
        shell: pwsh
        run: |
          cargo build --release -p cm-guard
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/release/cm-guard.exe src-tauri/binaries/cm-guard-x86_64-pc-windows-msvc.exe
      - name: Tests
        run: cargo test --workspace
      # Signs the installer for the in-app updater. Without the secrets (forks, PRs) the
      # installer is built unsigned and a release gets no latest.json.
      - name: Build installer
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content updater.json
            npx --yes @tauri-apps/cli@2 build --config "$PWD/updater.json"
          } else {
            npx --yes @tauri-apps/cli@2 build
          }
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      # Only the installer: one thing to download, installs/updates a single app in place.
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-${{ steps.ver.outputs.version }}-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # The installer with its updater signature, for the release job.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-release
          path: target/release/bundle/nsis/*.exe*
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu: the AppImage then runs on newer systems too, and its polkit
    # reads the .pkla grant the smoke test needs.
    runs-on: ubuntu-22.04
    needs: android
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle
          path: src-tauri/resources/android
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app's own tests run here too: the Linux blocker and the autostart service.
      - name: Tests
        run: cargo test --workspace
      - name: Build packages
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater.json
            npx --yes @tauri-apps/cli@2 build --config "$PWD/updater.json"
          else
            npx --yes @tauri-apps/cli@2 build
          fi
      # Installs the .deb, blocks through pkexec, drives the running app over MCP, uninstalls.
      - name: Smoke test
        run: bash scripts/linux-smoke.sh target/release/bundle/deb/*.deb
      - name: Version
        id: ver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ClockManage-${{ steps.ver.outputs.version }}-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      # One flat folder: with two paths upload-artifact would keep deb/ and appimage/, and the
      # release job looks for the packages and their signatures at the top.
      - name: Release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir linux-release
          cp target/release/bundle/deb/*.deb* target/release/bundle/appimage/*.AppImage* linux-release/
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: linux-release
          path: linux-release/
          if-no-files-found: error

  # One release with every file at once: installed apps read releases/latest, and a release
  # without latest.json yet would fail their check.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle
          path: android
      - name: Android APK
        run: cp android/ClockManage-android.apk "release/ClockManage-android-$(jq -r .version src-tauri/tauri.conf.json).apk"
      # What the apps read to update themselves: releases/latest/download/latest.json. The Linux
      # app picks the entry of its own package type.
      - name: Update manifest
        if: env.SIGNED == 'true'
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          entry() {
            f=$(ls release/$1)
            jq -n --arg url "$base/$(basename "$f")" --rawfile sig "$f.sig" '{signature: ($sig | gsub("^\\s+|\\s+$"; "")), url: $url}'
          }
          jq -n --arg version "$(jq -r .version src-tauri/tauri.conf.json)" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win "$(entry '*-setup.exe')" --argjson deb "$(entry '*.deb')" --argjson appimage "$(entry '*.AppImage')" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": $win, "linux-x86_64-deb": $deb, "linux-x86_64-appimage": $appimage}}' \
            > release/latest.json
          cat release/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/*.apk
            release/latest.json
